[package]
name = "ledger_secure_sdk_sys"
version = "1.17.0"
authors = ["Ledger"]
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Bindings to Ledger C SDK"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.0.73"
glob = "0.3.1"

[dependencies]
embedded-alloc = { version = "0.5.1", optional = true }
critical-section = { version = "1.2.0", optional = true }

[features]
heap = ["dep:embedded-alloc", "dep:critical-section"]
nano_nbgl = []
debug_csdk = []
mlkem = []
mldsa = []
mldsa_87 = ["mldsa"]
mldsa_optimization = ["mldsa"]
# Application storage (C SDK lib_standard_app/app_storage.c): a versioned, CRC-checked region
# at the start of the app data, meant for the OS to keep across app updates. Its size comes
# from the APP_STORAGE_SIZE environment variable (default 480 bytes).
app_storage = []
# Mark the storage as holding settings / application data (header properties).
app_storage_settings = ["app_storage"]
app_storage_data = ["app_storage"]
# Run the IO stack (USB classes, BLE, NFC) in the application instead of the OS, as
# DISABLE_OS_IO_STACK_USE does for C applications: the build drops USE_OS_IO_STACK.
app_io_stack = []

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanox", "nanosplus"))']
