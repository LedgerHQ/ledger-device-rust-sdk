[package]
name = "include_gif"
version = "1.3.2"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "procedural macro that packs a gif image into a byte representation"

[lib]
proc-macro = true

[dependencies]
syn = { version = "1.0", features = ["full"] }
flate2 = "1.0.28"
png = "0.18"
gif = "0.14"
