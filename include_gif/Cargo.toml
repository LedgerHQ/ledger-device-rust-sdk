[package]
name = "include_gif"
version = "1.3.1"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "procedural macro that packs a gif image into a byte representation"

[lib]
proc-macro = true

[dependencies]
syn = { version = "1.0", features = ["full"] }
flate2 = "1.0.28"
# Decode PNG/GIF directly instead of pulling the full `image` crate (and its
# color-management stack). The luma conversion in src/lib.rs reproduces
# `image::to_luma8()` byte-for-byte; the snapshot test guards this.
png = "0.18"
gif = "0.14"
